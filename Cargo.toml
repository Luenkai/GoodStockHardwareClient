[package]
name = "goodstock-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Mark Dollentes <markdanieldollentes23@gmail.com>"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
directories = "5"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
eframe = { version = "0.29", features = ["android-native-activity"] }

[package.metadata.android]
package = "ph.goodstock.hardware"
apk_name = "goodstock-hardware"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android.application]
label = "Goodstock Hardware"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
