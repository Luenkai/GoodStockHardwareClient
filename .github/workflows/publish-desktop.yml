name: Publish desktop release assets
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/publish-desktop.yml']
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop downloads workflow run ID
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify draft release and build
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN: ${{ inputs.build_run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            drafts=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.draft) | .tag_name]')
            count=$(jq length <<< "$drafts")
            if [ "$count" = 0 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$count" != 1 ]; then echo "::error::Select a draft release explicitly"; exit 1; fi
            tag=$(jq -r '.[0]' <<< "$drafts")
          fi
          info=$(gh release view "$tag" --json isDraft,targetCommitish)
          test "$(jq -r .isDraft <<< "$info")" = true
          target=$(jq -r .targetCommitish <<< "$info")
          run="${INPUT_RUN:-$(gh run list --workflow desktop.yml --commit "$target" --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')}"
          test -n "$run" && test "$run" != null
          build=$(gh run view "$run" --json headSha,conclusion)
          test "$(jq -r .headSha <<< "$build")" = "$target"
          test "$(jq -r .conclusion <<< "$build")" = success
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Download Windows
        if: steps.release.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: goodstock-windows-x64
          path: artifacts/windows
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Linux
        if: steps.release.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: goodstock-linux-x64
          path: artifacts/linux
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Mac Apple silicon
        if: steps.release.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: goodstock-macos-apple-silicon
          path: artifacts/mac-arm
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Mac Intel
        if: steps.release.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: goodstock-macos-intel
          path: artifacts/mac-intel
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release downloads
        if: steps.release.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          (cd artifacts/windows && zip -q "$GITHUB_WORKSPACE/release/Goodstock-Windows-x64.zip" 'Goodstock Hardware.exe' README.txt IMAGE-CREDITS.txt)
          cp artifacts/linux/goodstock-linux-x64.tar.gz release/Goodstock-Linux-x64.tar.gz
          cp 'artifacts/mac-arm/Goodstock Hardware macOS.zip' release/Goodstock-macOS-Apple-Silicon.zip
          (cd artifacts/mac-arm && zip -q "$GITHUB_WORKSPACE/release/Goodstock-macOS-Apple-Silicon.zip" IMAGE-CREDITS.txt README.txt)
          cp 'artifacts/mac-intel/Goodstock Hardware macOS.zip' release/Goodstock-macOS-Intel.zip
          (cd artifacts/mac-intel && zip -q "$GITHUB_WORKSPACE/release/Goodstock-macOS-Intel.zip" IMAGE-CREDITS.txt README.txt)
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Upload to the draft release
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
