name: Desktop downloads
on:
  push:
    branches: ['arena/**', 'main']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: goodstock-windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: goodstock-macos-apple-silicon
            target: aarch64-apple-darwin
          - os: macos-latest
            artifact: goodstock-macos-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            artifact: goodstock-linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
      - name: Build desktop app
        run: cargo build --release --bin goodstock-desktop --target ${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/goodstock-desktop.exe' 'package/Goodstock Hardware.exe'
          Copy-Item README.md package/README.txt
          Copy-Item assets/IMAGE-CREDITS.md package/IMAGE-CREDITS.txt
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p 'package/Goodstock Hardware.app/Contents/MacOS'
          cp 'target/${{ matrix.target }}/release/goodstock-desktop' 'package/Goodstock Hardware.app/Contents/MacOS/GoodstockHardware'
          cat > 'package/Goodstock Hardware.app/Contents/Info.plist' <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Goodstock Hardware</string>
          <key>CFBundleDisplayName</key><string>Goodstock Hardware</string>
          <key>CFBundleIdentifier</key><string>ph.goodstock.hardware.desktop</string>
          <key>CFBundleExecutable</key><string>GoodstockHardware</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - 'package/Goodstock Hardware.app'
          # Preserve executable permissions and bundle metadata inside the artifact zip.
          ditto -c -k --sequesterRsrc --keepParent 'package/Goodstock Hardware.app' 'Goodstock Hardware macOS.zip'
          rm -rf 'package/Goodstock Hardware.app'
          mv 'Goodstock Hardware macOS.zip' package/
          cp README.md package/README.txt
          cp assets/IMAGE-CREDITS.md package/IMAGE-CREDITS.txt
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp 'target/${{ matrix.target }}/release/goodstock-desktop' 'package/Goodstock Hardware'
          chmod +x 'package/Goodstock Hardware'
          cp README.md package/README.txt
          cp assets/IMAGE-CREDITS.md package/IMAGE-CREDITS.txt
          tar -C package -czf goodstock-linux-x64.tar.gz 'Goodstock Hardware' README.txt IMAGE-CREDITS.txt
          rm -rf package && mkdir package && mv goodstock-linux-x64.tar.gz package/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
          retention-days: 90
